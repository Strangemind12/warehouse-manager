name: Build Android APK/AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # ── Debug APK (no signing required) ──────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure web dir exists
        run: mkdir -p public

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-manager-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # ── Release AAB + APK (signed when keystore secrets are present) ──
  build-release:
    name: Build Release AAB
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure web dir exists
        run: mkdir -p public

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No keystore secret set - release build will be unsigned."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          cat > android/keystore.properties << EOF
          storeFile=keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Configure release signing
        run: |
          cd android
          if [ ! -f keystore.properties ]; then
            echo "No keystore.properties - skipping signing config."
            exit 0
          fi
          python3 - << 'PY'
          import re, pathlib
          p = pathlib.Path("app/build.gradle")
          s = p.read_text()
          props = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("keystore.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
          signing = """
              signingConfigs {
                  release {
                      storeFile file(keystoreProperties["storeFile"])
                      storePassword keystoreProperties["storePassword"]
                      keyAlias keystoreProperties["keyAlias"]
                      keyPassword keystoreProperties["keyPassword"]
                  }
              }
          """
          s = props + s
          s = s.replace("android {", "android {\n" + signing, 1)
          s = s.replace("buildTypes {", 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            minifyEnabled false\n        }', 1)
          p.write_text(s)
          print(s[:1500])
          PY

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-manager-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-manager-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
